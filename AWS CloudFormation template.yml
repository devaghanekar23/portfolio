AWSTemplateFormatVersion: '2010-09-09'
Description: 'A minimal CloudFormation template to deploy an S3 Bucket, VPC, and EC2 Instance.'

Resources:
  # --- S3 BUCKET ---
  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: deva23252005

  # --- VPC ---
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: deva
          Value: MyVPC-From-CloudFormation

  # --- SUBNET ---
  MySubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24

  # --- EC2 INSTANCE ---
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: "ami-0b6d9d3d33ba97d99"
      SubnetId: !Ref MySubnet

Outputs:
  S3BucketName:
    Value: !Ref MyS3Bucket
  VpcId:
    Value: !Ref MyVPC
  EC2InstanceId:
    Value: !Ref MyEC2Instance
